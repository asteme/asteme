# Once a day: the lines visitors chose to share are fetched, sieved (scripts/sieve-lines.mjs), and proposed as a pull request that adds them to
# site/lines.json. Nothing is on the site until a person has read that pull request and merged it.
# Needs: the variable LINES_URL (the Worker's address), the secret LINES_KEY (the Worker's KEY), and the secret LINES_PR_TOKEN (a fine-grained token for this
# repository with contents and pull requests: read and write). A pull request opened with the workflow's own token would not start the tests it has to pass.
# Without them it does nothing.
name: lines
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sieve:
    runs-on: ubuntu-latest
    if: ${{ vars.LINES_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.LINES_PR_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: sieve
        env:
          LINES_URL: ${{ vars.LINES_URL }}
          LINES_KEY: ${{ secrets.LINES_KEY }}
        run: node scripts/sieve-lines.mjs | tee sieve.txt
      - name: Propose what is left
        env:
          GH_TOKEN: ${{ secrets.LINES_PR_TOKEN }}
        run: |
          if git diff --quiet -- site/lines.json; then echo "Nothing to propose."; exit 0; fi
          branch="lines/$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "asteme-lines"
          git config user.email "lines@users.noreply.github.com"
          git checkout -b "$branch"
          git add site/lines.json
          git commit -m "Lines left by visitors, to be read before they are shown"
          git push origin "$branch"
          gh pr create --title "Lines left by visitors ($(date -u +%Y-%m-%d))" --body "$(printf 'Read every added line before merging: merging puts them on the site, in everyone'"'"'s sky.\n\nRemove any line you would not want there (edit the file in this pull request), then merge. Closing without merging drops them all.\n\nThe sieve: %s' "$(cat sieve.txt)")"
