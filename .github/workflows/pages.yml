# Publishes the site (site/, built by scripts/make-site.mjs) to GitHub Pages when what it is made from changes on main.
# The repository's Pages setting must be "GitHub Actions" for this to have somewhere to publish to.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "brain/page/**", "brain/page.mjs", "brain/server.mjs", "client/copy.mjs", "client/locales/**", "client/icon.mjs", "public/media/**", "scripts/make-site.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/make-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
