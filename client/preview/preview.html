 * ASTEME design tokens.
 *
 * This file is the theme. styles.css reads these roles and holds no raw
 * colors, sizes or durations of its own. To retheme, override the roles here
 * (or from the host, on .asteme-page) and leave styles.css alone.
 *
 * Default theme: derived from the host text color, so it follows whatever
 * light or dark theme DSH is using. Hue is reserved for state (danger,
 * warning, positive); everything else is the host color at a given strength.
 *
 * One rule keeps the derived defaults stable: \`currentColor\` resolves where a
 * token is used, so set \`color\` on leaf text only, never on a container whose
 * children use these tokens. Explicit hex values have no such limit.
 */
.asteme-page {
  /* Text */
  --ast-text-muted: color-mix(in srgb, currentColor 68%, transparent);

  /* Lines */
  --ast-line: color-mix(in srgb, currentColor 14%, transparent);
  --ast-line-strong: color-mix(in srgb, currentColor 30%, transparent);
  --ast-control-line: color-mix(in srgb, currentColor 52%, transparent);
  --ast-control-line-hover: color-mix(in srgb, currentColor 70%, transparent);

  /* Fills (laid over the host background) */
  --ast-fill-1: color-mix(in srgb, currentColor 4%, transparent);
  --ast-fill-2: color-mix(in srgb, currentColor 8%, transparent);
  --ast-fill-hover: color-mix(in srgb, currentColor 7%, transparent);
  --ast-fill-press: color-mix(in srgb, currentColor 12%, transparent);
  --ast-field-bg: transparent;

  /* Accent: selected tab, switch, focus ring. Monochrome by default. */
  --ast-accent: currentColor;
  --ast-focus: currentColor;
  --ast-focus-width: 2px;

  /* Primary action */
  --ast-primary-bg: color-mix(in srgb, currentColor 12%, transparent);
  --ast-primary-bg-hover: color-mix(in srgb, currentColor 18%, transparent);
  --ast-primary-fg: currentColor;
  --ast-primary-line: color-mix(in srgb, currentColor 62%, transparent);

  /* State hues. Text roles lean toward the host text color so they stay
     readable on both light and dark backgrounds. */
  --ast-danger-hue: #d43a2f;
  --ast-danger: color-mix(in oklab, var(--ast-danger-hue) 66%, currentColor);
  --ast-danger-line: color-mix(in srgb, var(--ast-danger-hue) 60%, transparent);
  --ast-danger-fill: color-mix(in srgb, var(--ast-danger-hue) 10%, transparent);
  --ast-danger-fill-hover: color-mix(in srgb, var(--ast-danger-hue) 18%, transparent);

  --ast-warning-hue: #b26a00;
  --ast-warning: color-mix(in oklab, var(--ast-warning-hue) 74%, currentColor);
  --ast-warning-line: color-mix(in srgb, var(--ast-warning-hue) 60%, transparent);
  --ast-warning-fill: color-mix(in srgb, var(--ast-warning-hue) 12%, transparent);

  --ast-positive-hue: #1f8a4c;
  --ast-positive: color-mix(in oklab, var(--ast-positive-hue) 74%, currentColor);

  /* Type */
  --ast-font: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", system-ui, sans-serif;
  --ast-font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
  --ast-text-xs: 0.75rem;
  --ast-text-sm: 0.8125rem;
  --ast-text-md: 0.875rem;
  --ast-text-lg: 1rem;
  --ast-text-xl: 1.125rem;  /* the claim at the top of an account */
  --ast-leading: 1.5;
  --ast-leading-tight: 1.25;
  --ast-weight-regular: 400;
  --ast-weight-medium: 500;
  --ast-weight-strong: 600;
  --ast-wordmark-tracking: 0.08em;

  /* Space (4px base) */
  --ast-space-1: 4px;
  --ast-space-2: 8px;
  --ast-space-3: 12px;
  --ast-space-4: 16px;
  --ast-space-5: 24px;
  --ast-space-6: 32px;

  /* Layout */
  --ast-gutter: 16px;       /* page padding below 560px */
  --ast-gutter-wide: 24px;  /* page padding from 560px */
  --ast-measure: 720px;     /* widest the content column grows */
  --ast-label-col: 8.5rem;  /* label column of fact rows from 480px */

  /* Shape */
  --ast-radius-sm: 4px;
  --ast-radius-md: 6px;
  --ast-control-h: 30px;
  --ast-stroke: 1.6px;      /* matches the icon stroke */
  --ast-node: 9px;          /* a point on a trace */
  /* The star: its size says how easily a memory comes to mind. */
  --ast-star-lg: 11px;
  --ast-star-md: 8px;
  --ast-star-sm: 5px;
  --ast-star-box: 14px;     /* the column every star is centred in */

  /* Motion */
  --ast-dur: 120ms;
  --ast-ease: cubic-bezier(0.2, 0, 0, 1);

  /* Misc */
  --ast-disabled-opacity: 0.5;
}

`;var Of=`/*
 * ASTEME panel styles. Reads roles from tokens.css; holds no raw theme
 * values. Every selector is scoped under .asteme-page so nothing leaks into
 * the host and host element styles cannot outrank these.
 *
 *   1. Root and reset
 *   2. Shell         (header, tabs, back bar, body, save bar)
 *   3. Controls      (button, field, switch, disclosure, confirm)
 *   4. Text pieces   (section, chip, notice, facts, quote, lists)
 *   5. The star and the trace: the two marks that carry meaning
 *   6. Views         (rows, verdict, questions, account, activity, charter)
 *   7. Width and motion
 */

/* 1. Root and reset ------------------------------------------------------ */

.asteme-page {
  container: asteme / inline-size;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  min-height: 0;
  color: inherit;
  font-family: var(--ast-font);
  font-size: var(--ast-text-md);
  line-height: var(--ast-leading);
  text-align: start;
}
.asteme-page *,
.asteme-page *::before,
.asteme-page *::after { box-sizing: border-box; }
.asteme-page :where(h2, h3, p, ul, ol, dl, dd, blockquote, pre) { margin: 0; padding: 0; }
.asteme-page :where(ul, ol) { list-style: none; }
.asteme-page :where(button, input, select, textarea) { margin: 0; font: inherit; color: inherit; }
.asteme-page [hidden] { display: none !important; }
.asteme-page :focus-visible { outline: var(--ast-focus-width) solid var(--ast-focus); outline-offset: 2px; }
.asteme-page .ast-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.asteme-page .ast-soft { color: var(--ast-text-muted); font-size: var(--ast-text-sm); }
.asteme-page .ast-hint { color: var(--ast-text-muted); font-size: var(--ast-text-sm); }
.asteme-page .ast-empty { color: var(--ast-text-muted); }

/* 2. Shell --------------------------------------------------------------- */

/* The top and the save bar never scroll, so where you are, what just
   happened and unsaved work stay in view. All three regions reserve the same
   scrollbar gutter so their columns line up. */
.asteme-page .ast-top,
.asteme-page .ast-body,
.asteme-page .ast-foot {
  padding-inline: var(--ast-gutter);
  overflow-y: auto;
  scrollbar-gutter: stable;
  scrollbar-width: thin;
  scrollbar-color: var(--ast-line-strong) transparent;
}
.asteme-page .ast-top { flex: none; padding-block-start: var(--ast-space-3); }
.asteme-page .ast-body { flex: 1 1 auto; min-height: 0; padding-block: var(--ast-space-5) var(--ast-space-6); }
.asteme-page .ast-top > *,
.asteme-page .ast-body > *,
.asteme-page .ast-foot > * { max-width: var(--ast-measure); margin-inline: auto; }

.asteme-page .ast-header { display: flex; align-items: center; gap: var(--ast-space-2); min-height: var(--ast-control-h); }
.asteme-page .ast-brand { display: flex; align-items: center; gap: var(--ast-space-2); margin-inline-end: auto; }
.asteme-page--section { padding: 0; min-height: 0; background: none; }
.asteme-page--section .ast-account__head { display: none; }
.asteme-page .ast-home { padding: var(--ast-space-1) var(--ast-space-2); margin-inline-start: calc(var(--ast-space-2) * -1); border: 0; border-radius: var(--ast-radius-md); background: none; color: inherit; font: inherit; cursor: pointer; }
.asteme-page .ast-home:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
.asteme-page .ast-home:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
.asteme-page .ast-home__word { font-size: var(--ast-text-sm); opacity: .62; margin-inline-start: var(--ast-space-1); }
.asteme-page .ast-brand h2 {
  font-size: var(--ast-text-md);
  font-weight: var(--ast-weight-strong);
  letter-spacing: var(--ast-wordmark-tracking);
  line-height: 1;
}
/* What just happened. It appears at the bottom edge, outside the scrolling
   area, so nothing being read moves when it comes and goes. */
.asteme-page .ast-said {
  display: flex;
  flex: none;
  align-items: center;
  gap: var(--ast-space-2);
  padding: var(--ast-space-2) var(--ast-gutter);
  border-block-start: 1px solid var(--ast-line);
  font-size: var(--ast-text-sm);
}
.asteme-page .ast-said:empty { display: none; }
.asteme-page .ast-said__mark { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--ast-positive); }

/* On or off, always visible, and the way into settings. */
.asteme-page .ast-power {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  min-height: 24px;
  padding: 0 var(--ast-space-2);
  border: 0;
  border-radius: var(--ast-radius-sm);
  background: none;
  font-size: var(--ast-text-xs);
  font-weight: var(--ast-weight-medium);
  white-space: nowrap;
  cursor: pointer;
}
.asteme-page .ast-power:hover { background: var(--ast-fill-hover); }
.asteme-page .ast-power__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ast-positive); }
.asteme-page .ast-power--off { color: var(--ast-warning); }
.asteme-page .ast-power--off .ast-power__dot { border: var(--ast-stroke) solid var(--ast-warning); background: none; }

.asteme-page .ast-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: var(--ast-control-h);
  height: var(--ast-control-h);
  border: 0;
  border-radius: var(--ast-radius-md);
  background: none;
  color: var(--ast-text-muted);
  cursor: pointer;
  transition: background-color var(--ast-dur) var(--ast-ease), color var(--ast-dur) var(--ast-ease);
}
.asteme-page .ast-icon-btn:hover:not(:disabled),
.asteme-page .ast-icon-btn[aria-pressed="true"] { background: var(--ast-fill-hover); color: currentColor; }
.asteme-page .ast-icon-btn:disabled { cursor: default; }
.asteme-page .ast-glyph { flex: none; }

.asteme-page .ast-tabs {
  display: flex;
  gap: var(--ast-space-5);
  margin-block-start: var(--ast-space-2);
  border-block-end: 1px solid var(--ast-line);
}
.asteme-page .ast-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-block-end: -1px;
  padding: var(--ast-space-2) 0;
  border: 0;
  border-block-end: 2px solid transparent;
  background: none;
  color: var(--ast-text-muted);
  font-weight: var(--ast-weight-medium);
  white-space: nowrap;
  cursor: pointer;
  transition: color var(--ast-dur) var(--ast-ease), border-color var(--ast-dur) var(--ast-ease);
}
.asteme-page .ast-tab:hover { color: currentColor; }
.asteme-page .ast-tab[aria-selected="true"] { border-block-end-color: var(--ast-accent); color: currentColor; font-weight: var(--ast-weight-strong); }

  background: var(--ast-warning-fill);
  /* Sits inside a tab whose text may be muted, so it leans further toward the
     text color than --ast-warning does to stay readable in both themes. */
  color: color-mix(in oklab, var(--ast-warning-hue) 50%, currentColor);
  font-size: var(--ast-text-xs);
  font-weight: var(--ast-weight-strong);
  font-variant-numeric: tabular-nums;
  line-height: 18px;
  text-align: center;
}
.asteme-page .ast-tab__flag { width: 6px; height: 6px; border-radius: 50%; background: var(--ast-warning); }
.asteme-page .ast-panel:focus { outline: none; }

.asteme-page .ast-backbar { margin-block-start: var(--ast-space-2); border-block-end: 1px solid var(--ast-line); padding-block-end: var(--ast-space-1); }
.asteme-page .ast-back {
  display: inline-flex;
  align-items: center;
  gap: var(--ast-space-1);
  min-height: var(--ast-control-h);
  margin-inline-start: -6px;
  padding: 0 var(--ast-space-2) 0 var(--ast-space-1);
  border: 0;
  border-radius: var(--ast-radius-md);
  background: none;
  font-weight: var(--ast-weight-medium);
  cursor: pointer;
}
.asteme-page .ast-back:hover { background: var(--ast-fill-hover); }

.asteme-page .ast-scope {
  display: flex;
  align-items: center;
  gap: var(--ast-space-3);
  margin-block-start: var(--ast-space-3);
  color: var(--ast-text-muted);
  font-size: var(--ast-text-sm);
}
.asteme-page .ast-scope .ast-select { flex: 1 1 auto; max-width: 20rem; color: currentColor; }
.asteme-page .ast-top > .ast-notice { margin-block-start: var(--ast-space-3); }

.asteme-page .ast-foot {
  display: flex;
  flex: none;
  align-items: center;
  justify-content: flex-end;
  gap: var(--ast-space-2);
  padding-block: var(--ast-space-3);
  border-block-start: 1px solid var(--ast-line);
}
.asteme-page .ast-foot > * { margin-inline: 0; }
.asteme-page .ast-foot__text { margin-inline-end: auto; color: var(--ast-text-muted); font-size: var(--ast-text-sm); }

/* Vertical rhythm of a view. */
.asteme-page .ast-panel > * + *,
.asteme-page .ast-account > * + *,
.asteme-page .ast-form > * + * { margin-block-start: var(--ast-space-6); }
.asteme-page .ast-panel > .ast-notice + *,
.asteme-page .ast-panel > .ast-search + *,
.asteme-page .ast-panel > .ast-summary + * { margin-block-start: var(--ast-space-2); }
.asteme-page .ast-panel > .ast-legend + * { margin-block-start: var(--ast-space-5); }
.asteme-page .ast-panel > .ast-section + .ast-disc,
.asteme-page .ast-panel > .ast-form + .ast-disc,
.asteme-page .ast-account > .ast-section + .ast-disc { margin-block-start: var(--ast-space-5); }

.asteme-page .ast-loading { display: flex; align-items: center; gap: var(--ast-space-2); color: var(--ast-text-muted); }
.asteme-page .ast-blank { padding-block: var(--ast-space-6); }
.asteme-page .ast-blank__title { font-weight: var(--ast-weight-strong); margin-block-end: var(--ast-space-1); }
.asteme-page .ast-blank .ast-soft { max-width: 34rem; }

/* 3. Controls ------------------------------------------------------------ */

.asteme-page .ast-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: var(--ast-control-h);
  padding: 3px var(--ast-space-3);
  border: 1px solid var(--ast-control-line);
  border-radius: var(--ast-radius-md);
  background: transparent;
  font-size: var(--ast-text-sm);
  font-weight: var(--ast-weight-medium);
  line-height: var(--ast-leading-tight);
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--ast-dur) var(--ast-ease), border-color var(--ast-dur) var(--ast-ease);
}
.asteme-page .ast-btn:hover:not(:disabled) { background: var(--ast-fill-hover); }
.asteme-page .ast-btn:active:not(:disabled) { background: var(--ast-fill-press); }
.asteme-page .ast-btn:disabled { opacity: var(--ast-disabled-opacity); cursor: default; }
.asteme-page .ast-btn[aria-busy="true"] { opacity: 1; }
.asteme-page .ast-btn--primary { border-color: var(--ast-primary-line); background: var(--ast-primary-bg); color: var(--ast-primary-fg); font-weight: var(--ast-weight-strong); }
.asteme-page .ast-btn--primary:hover:not(:disabled) { background: var(--ast-primary-bg-hover); }
.asteme-page .ast-btn--danger { border-color: var(--ast-danger-line); background: var(--ast-danger-fill); color: var(--ast-danger); font-weight: var(--ast-weight-strong); }
.asteme-page .ast-btn--danger:hover:not(:disabled) { background: var(--ast-danger-fill-hover); }
.asteme-page .ast-btn--ghost { border-color: transparent; }
/* Opens a confirmation. Reads as destructive without shouting; the danger
   fill is kept for the button that actually does it. */
.asteme-page .ast-btn--quiet-danger { color: var(--ast-danger); }
.asteme-page .ast-btn--quiet-danger:hover:not(:disabled) { background: var(--ast-danger-fill); }
/* An answer to a question: lighter than an action, so three fit on one line. */
.asteme-page .ast-btn--choice { min-height: 26px; padding-inline: var(--ast-space-2); }

.asteme-page .ast-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ast-space-2); }
.asteme-page .ast-actions + .ast-actions { margin-block-start: var(--ast-space-2); }
.asteme-page .ast-actions--quiet { margin-inline-start: calc(var(--ast-space-3) * -1); }
.asteme-page .ast-actions--quiet .ast-btn { border-color: transparent; }
.asteme-page .ast-actions + .ast-hint { margin-block-start: var(--ast-space-3); }

.asteme-page .ast-link {
  display: inline;
  padding: 0;
  border: 0;
  background: none;
  font-weight: inherit;
  text-align: start;
  text-decoration: underline;
  text-decoration-color: var(--ast-line-strong);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  cursor: pointer;
}
.asteme-page .ast-link:hover:not(:disabled) { text-decoration-color: currentColor; }
.asteme-page .ast-link:disabled { cursor: default; opacity: var(--ast-disabled-opacity); }

.asteme-page .ast-field { display: flex; flex-direction: column; gap: 6px; }
.asteme-page .ast-field + .ast-field { margin-block-start: var(--ast-space-4); }
.asteme-page .ast-field__head { display: flex; align-items: center; gap: var(--ast-space-2); }
.asteme-page .ast-field__label { display: flex; align-items: center; gap: var(--ast-space-2); font-size: var(--ast-text-sm); font-weight: var(--ast-weight-medium); }
.asteme-page .ast-input {
  display: block;
  width: 100%;
  min-width: 0;
  min-height: var(--ast-control-h);
  padding: 5px 10px;
  border: 1px solid var(--ast-control-line);
  border-radius: var(--ast-radius-md);
  background: var(--ast-field-bg);
  line-height: var(--ast-leading-tight);
  transition: border-color var(--ast-dur) var(--ast-ease);
}
.asteme-page .ast-input:hover:not(:disabled) { border-color: var(--ast-control-line-hover); }
.asteme-page .ast-input:focus-visible { outline-offset: 0; }
.asteme-page .ast-input:disabled { opacity: var(--ast-disabled-opacity); }
.asteme-page .ast-input::placeholder { color: var(--ast-text-muted); }
.asteme-page textarea.ast-input { min-height: 3.5rem; padding-block: 7px; line-height: var(--ast-leading); resize: vertical; }
.asteme-page .ast-select { position: relative; display: block; }
.asteme-page .ast-select select { appearance: none; padding-inline-end: 30px; color-scheme: inherit; cursor: pointer; text-overflow: ellipsis; }
/* The opened list is the browser's own surface. Its rows take the system's
   pair for the scheme in force, so text and background always differ. */
.asteme-page .ast-select select option, .asteme-page .ast-select select optgroup { background-color: Canvas; color: CanvasText; }
.asteme-page .ast-select::after {
  content: "";
  position: absolute;
  inset-block-start: 50%;
  inset-inline-end: 12px;
  width: 6px;
  height: 6px;
  border: solid currentColor;
  border-width: 0 var(--ast-stroke) var(--ast-stroke) 0;
  opacity: 0.7;
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

/* Switch: a hollow point that slides across and fills when on. */
.asteme-page .ast-switch-row { display: flex; align-items: flex-start; gap: var(--ast-space-4); }
.asteme-page .ast-switch-row + .ast-switch-row { margin-block-start: var(--ast-space-4); }
.asteme-page .ast-switch-row__text { flex: 1 1 auto; min-width: 0; }
.asteme-page .ast-switch-row__label { display: block; font-weight: var(--ast-weight-medium); cursor: pointer; }
.asteme-page .ast-switch {
  appearance: none;
  position: relative;
  flex: none;
  width: 36px;
  height: 20px;
  border: var(--ast-stroke) solid var(--ast-control-line);
  border-radius: 10px;
  background: transparent;
  cursor: pointer;
  transition: background-color var(--ast-dur) var(--ast-ease), border-color var(--ast-dur) var(--ast-ease);
}
.asteme-page .ast-switch::before {
  content: "";
  position: absolute;
  inset-block-start: 50%;
  inset-inline-start: 3px;
  width: 11px;
  height: 11px;
  border: var(--ast-stroke) solid var(--ast-control-line-hover);
  border-radius: 50%;
  transform: translateY(-50%);
  transition: transform var(--ast-dur) var(--ast-ease), background-color var(--ast-dur) var(--ast-ease);
}
.asteme-page .ast-switch:checked { border-color: var(--ast-accent); background: var(--ast-fill-press); }
.asteme-page .ast-switch:checked::before { border-color: var(--ast-accent); background: var(--ast-accent); transform: translate(16px, -50%); }
.asteme-page .ast-switch:disabled { opacity: var(--ast-disabled-opacity); cursor: default; }

.asteme-page .ast-disc { border-block-start: 1px solid var(--ast-line); }
.asteme-page .ast-disc + .ast-disc { margin-block-start: 0; }
.asteme-page .ast-disc:last-child { border-block-end: 1px solid var(--ast-line); }
.asteme-page .ast-disc__toggle {
  display: flex;
  align-items: center;
  gap: var(--ast-space-2);
  width: 100%;
  min-height: 40px;
  padding: 0;
  border: 0;
  background: none;
  font-weight: var(--ast-weight-medium);
  text-align: start;
  cursor: pointer;
}
.asteme-page .ast-chevron {
  flex: none;
  width: 6px;
  height: 6px;
  margin-inline: 2px 3px;
  border: solid currentColor;
  border-width: 0 var(--ast-stroke) var(--ast-stroke) 0;
  opacity: 0.7;
  transform: rotate(-45deg);
  transition: transform var(--ast-dur) var(--ast-ease);
}
.asteme-page [aria-expanded="true"] > .ast-chevron { transform: translateY(-2px) rotate(45deg); }
.asteme-page .ast-disc__body { padding-block: 0 var(--ast-space-4); }
.asteme-page .ast-disc__body > * + * { margin-block-start: var(--ast-space-3); }
.asteme-page .ast-section .ast-disc { margin-block-start: var(--ast-space-4); }
.asteme-page .ast-section .ast-disc:last-child { border-block-end: 0; }
.asteme-page .ast-section .ast-disc:last-child > .ast-disc__body { padding-block-end: 0; }
.asteme-page .ast-count { color: var(--ast-text-muted); font-weight: var(--ast-weight-regular); font-variant-numeric: tabular-nums; }

/* Confirm: the destructive-action pattern. Opens in place of the buttons. */
.asteme-page .ast-confirm { padding: var(--ast-space-3); border: 1px solid var(--ast-danger-line); border-radius: var(--ast-radius-md); }
.asteme-page .ast-confirm__msg { font-size: var(--ast-text-sm); overflow-wrap: anywhere; }
.asteme-page .ast-queue { margin-block-start: var(--ast-space-1); padding-inline-start: var(--ast-space-3); border-inline-start: 1px solid var(--ast-line, currentColor); }
.asteme-page .ast-queue > li + li { margin-block-start: var(--ast-space-1); }
.asteme-page .ast-confirm__sure { display: flex; align-items: center; gap: var(--ast-space-2); margin-block-start: var(--ast-space-2); font-size: var(--ast-text-sm); cursor: pointer; }
.asteme-page .ast-confirm__msg + .ast-confirm__msg,
.asteme-page .ast-confirm__list + .ast-confirm__msg { margin-block-start: var(--ast-space-2); }
.asteme-page .ast-confirm__list { margin-block-start: var(--ast-space-1); padding-inline-start: var(--ast-space-4); font-size: var(--ast-text-sm); font-weight: var(--ast-weight-medium); list-style: disc; }
.asteme-page .ast-confirm .ast-actions { margin-block-start: var(--ast-space-3); }

.asteme-page .ast-spinner {
  flex: none;
  width: 12px;
  height: 12px;
  border: var(--ast-stroke) solid var(--ast-line-strong);
  border-block-start-color: currentColor;
  border-radius: 50%;
  animation: ast-spin 700ms linear infinite;
}
@keyframes ast-spin { to { transform: rotate(360deg); } }

/* 4. Text pieces --------------------------------------------------------- */

.asteme-page .ast-section__head { display: flex; align-items: baseline; gap: var(--ast-space-2); }
.asteme-page .ast-section__title { font-size: var(--ast-text-md); font-weight: var(--ast-weight-strong); line-height: var(--ast-leading-tight); }
.asteme-page .ast-section__aside { margin-inline-start: auto; color: var(--ast-text-muted); font-size: var(--ast-text-sm); font-variant-numeric: tabular-nums; white-space: nowrap; }
.asteme-page .ast-section__lead { margin-block-start: 2px; color: var(--ast-text-muted); font-size: var(--ast-text-sm); max-width: 40rem; }
.asteme-page .ast-section__head + :not(.ast-section__lead),
.asteme-page .ast-section__lead + * { margin-block-start: var(--ast-space-3); }

.asteme-page .ast-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  /* A state is said in words, set small. No pill, no fill. */
  color: var(--ast-text-muted);
  font-size: var(--ast-text-xs);
  font-weight: var(--ast-weight-medium);
  line-height: 1.5;
  white-space: nowrap;
}
.asteme-page .ast-chip--warning { color: var(--ast-warning); }
.asteme-page .ast-chip--danger { color: var(--ast-danger); }
/* Lit: the last reply drew on it. The same ring the star wears. */
.asteme-page .ast-chip--lit { color: inherit; }

.asteme-page .ast-notice {
  display: flex;
  align-items: flex-start;
  gap: var(--ast-space-3);
  padding: var(--ast-space-2) var(--ast-space-3);
  border: 1px solid var(--ast-line-strong);
  border-radius: var(--ast-radius-sm);
  font-size: var(--ast-text-sm);
}
.asteme-page .ast-notice > .ast-btn { flex: none; }
.asteme-page .ast-notice__body { flex: 1 1 auto; min-width: 0; padding-block: 5px; overflow-wrap: anywhere; }
.asteme-page .ast-notice__detail { color: var(--ast-text-muted); }
.asteme-page .ast-notice--danger { border-color: var(--ast-danger-line); }
.asteme-page .ast-notice--danger .ast-notice__body > :first-child { color: var(--ast-danger); }
.asteme-page .ast-notice--warning { border-color: var(--ast-warning-line); }
.asteme-page * + .ast-notice { margin-block-start: var(--ast-space-3); }

.asteme-page .ast-facts { display: grid; row-gap: var(--ast-space-3); }
.asteme-page .ast-facts dt { color: var(--ast-text-muted); font-size: var(--ast-text-sm); }
.asteme-page .ast-facts dd { overflow-wrap: anywhere; white-space: pre-wrap; }

/* The user's own words. Everything the panel claims ends at one of these. */
.asteme-page .ast-quote { overflow-wrap: anywhere; white-space: pre-wrap; }
.asteme-page .ast-quote::before { content: open-quote; }
.asteme-page .ast-quote::after { content: close-quote; }
.asteme-page .ast-quote--full::before,
.asteme-page .ast-quote--full::after { content: none; }

.asteme-page .ast-plain-list > li + li { margin-block-start: var(--ast-space-3); }
.asteme-page .ast-plain-list.ast-soft > li + li { margin-block-start: var(--ast-space-1); }
.asteme-page .ast-plain-list.ast-soft > li { padding-inline-start: var(--ast-space-3); position: relative; }
.asteme-page .ast-plain-list.ast-soft > li::before { content: ""; position: absolute; inset-inline-start: 2px; inset-block-start: 0.7em; width: 3px; height: 3px; border-radius: 50%; background: currentColor; }
.asteme-page * + .ast-plain-list { margin-block-start: var(--ast-space-2); }

.asteme-page .ast-pre {
  max-height: 320px;
  padding: var(--ast-space-3);
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--ast-line-strong) transparent;
  border-radius: var(--ast-radius-md);
  background: var(--ast-fill-1);
  font-family: var(--ast-font-mono);
  font-size: var(--ast-text-xs);
  line-height: 1.6;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.asteme-page .ast-skeleton { display: grid; gap: var(--ast-space-2); }
.asteme-page .ast-skeleton span { height: 0.8em; border-radius: var(--ast-radius-sm); background: var(--ast-fill-2); animation: ast-pulse 1.2s ease-in-out infinite; }
.asteme-page .ast-skeleton span:nth-child(odd) { width: 82%; }
.asteme-page .ast-skeleton span:nth-child(even) { width: 58%; }
@keyframes ast-pulse { 50% { opacity: 0.45; } }

/* 5. The star and the trace ----------------------------------------------- */

/* A star's size says how easily a memory comes to mind. Hollow: not in use.
   A ring around it: the last reply drew on it. */
.asteme-page .ast-star-box {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: var(--ast-star-box);
  height: calc(var(--ast-leading) * 1em);
}
.asteme-page .ast-star { display: block; border-radius: 50%; background: currentColor; }
.asteme-page .ast-star--easily { width: var(--ast-star-lg); height: var(--ast-star-lg); }
.asteme-page .ast-star--sometimes { width: var(--ast-star-md); height: var(--ast-star-md); }
.asteme-page .ast-star--rarely { width: var(--ast-star-sm); height: var(--ast-star-sm); }
.asteme-page .ast-star--off { width: var(--ast-star-md); height: var(--ast-star-md); border: var(--ast-stroke) solid var(--ast-control-line); background: none; }
.asteme-page .ast-star--warning { background: var(--ast-warning); }
.asteme-page .ast-star--lit { outline: var(--ast-stroke) solid currentColor; outline-offset: 2px; }

/* A trace is an account told in order: each point follows from the one
   above it. No rail and no nodes; the order and the labels carry it. */
.asteme-page .ast-trace__point {
  position: relative;
  padding-block-end: var(--ast-space-4);
  --ast-mark-top: calc((var(--ast-leading) * 1em - var(--ast-node)) / 2);
}
.asteme-page .ast-trace__point:last-child { padding-block-end: 0; }
.asteme-page .ast-trace__mark {
  display: none;
  justify-self: center;
  width: var(--ast-node);
  height: var(--ast-node);
  margin-block-start: var(--ast-mark-top);
  border: var(--ast-stroke) solid currentColor;
  border-radius: 50%;
}
.asteme-page .ast-trace__mark--solid { background: currentColor; }
.asteme-page .ast-trace__mark--hollow { border-color: var(--ast-control-line); }
.asteme-page .ast-trace__mark--lit { background: currentColor; outline: var(--ast-stroke) solid currentColor; outline-offset: 2px; }
.asteme-page .ast-trace__mark--dotted { border-style: dotted; border-color: var(--ast-control-line-hover); }
.asteme-page .ast-trace__mark--cross { position: relative; border: 0; border-radius: 0; }
.asteme-page .ast-trace__mark--cross::before,
.asteme-page .ast-trace__mark--cross::after { content: ""; position: absolute; inset-block-start: 50%; inset-inline: -1px; height: var(--ast-stroke); margin-block-start: -0.8px; background: currentColor; transform: rotate(45deg); }
.asteme-page .ast-trace__mark--cross::after { transform: rotate(-45deg); }
.asteme-page .ast-trace__mark--danger { color: var(--ast-danger); }
.asteme-page .ast-trace__body { min-width: 0; overflow-wrap: anywhere; }
.asteme-page .ast-trace__body > * + * { margin-block-start: var(--ast-space-1); }
.asteme-page .ast-trace__label { color: var(--ast-text-muted); font-size: var(--ast-text-sm); }
.asteme-page .ast-trace + .ast-disc { margin-block-start: var(--ast-space-4); }
.asteme-page .ast-trace + .ast-btn { margin-block-start: var(--ast-space-2); margin-inline-start: calc(-1 * var(--ast-space-3)); }

/* 6. Views --------------------------------------------------------------- */

/* Rows: a whole line that opens something. */
.asteme-page .ast-rows { border-block-start: 1px solid var(--ast-line); }
.asteme-page .ast-rows > li { border-block-end: 1px solid var(--ast-line); }
.asteme-page .ast-rows > li:last-child { border-block-end: 0; }
.asteme-page .ast-section > .ast-rows:last-child > li:last-child { border-block-end: 0; }
.asteme-page .ast-row {
  display: grid;
  grid-template-columns: var(--ast-star-box) minmax(0, 1fr) auto;
  align-items: start;
  column-gap: var(--ast-space-3);
  width: 100%;
  padding: var(--ast-space-3) 0;
  border: 0;
  background: none;
  text-align: start;
}
/* The hover area reaches past the text on both sides, so the row reads as one target. */
.asteme-page button.ast-row {
  width: calc(100% + 2 * var(--ast-space-2));
  margin-inline: calc(var(--ast-space-2) * -1);
  padding-inline: var(--ast-space-2);
  border-radius: var(--ast-radius-md);
  cursor: pointer;
  transition: background-color var(--ast-dur) var(--ast-ease);
}
.asteme-page button.ast-row:hover { background: var(--ast-fill-hover); }
.asteme-page button.ast-row > .ast-glyph { align-self: center; color: var(--ast-text-muted); }
.asteme-page .ast-row--static > .ast-btn { align-self: center; }
.asteme-page .ast-row__main { display: grid; gap: 2px; min-width: 0; }
.asteme-page .ast-row__title {
  font-weight: var(--ast-weight-medium);
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
}
.asteme-page .ast-row__title--plain { font-weight: var(--ast-weight-regular); }
.asteme-page .ast-row__detail {
  color: var(--ast-text-muted);
  font-size: var(--ast-text-sm);
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}
