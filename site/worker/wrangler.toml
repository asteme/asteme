# The Worker that takes the lines visitors choose to share, and where they are read before they are shown (worker.js). Deployed by whoever holds the
# Cloudflare account, from this folder:
#   npx wrangler kv namespace create LINES        (put the id it prints below)
#   npx wrangler secret put KEY                    (a long random string: what you type on the page where the lines are read; kept nowhere else)
#   npx wrangler secret put SALT                   (another long random string; kept nowhere)
#   npx wrangler deploy
# Then put the Worker's address in site/config.mjs (SHARE_URL). The lines are read at <that address>/review.
name = "asteme-lines"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
ORIGIN = "https://asteme.github.io"

[[kv_namespaces]]
binding = "LINES"
id = "5aa4eee55e784f37bccf7ebaf828188d"
